name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.3. Defaults to the manifest version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          version="$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('pasteport/manifest.json', 'utf8')).version)")"
          tag="${GITHUB_REF_NAME}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi

          if [ -z "$tag" ]; then
            tag="v${version}"
          fi

          if [ "$tag" != "v${version}" ]; then
            echo "::error::Release tag ${tag} does not match manifest version ${version}."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "zip_name=pasteport-${tag}.zip" >> "$GITHUB_OUTPUT"

      - name: Package extension
        shell: bash
        run: |
          cd pasteport
          zip -r "../${{ steps.manifest.outputs.zip_name }}" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.manifest.outputs.tag }}"
          zip_name="${{ steps.manifest.outputs.zip_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_name" --clobber
            exit 0
          fi

          gh release create "$tag" "$zip_name" \
            --target "$GITHUB_SHA" \
            --title "PastePort $tag" \
            --notes "Release generated from pasteport/manifest.json version ${{ steps.manifest.outputs.version }}."
