<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PastePort — material promocional</title>
  <link rel="stylesheet" href="promo.css">
  <script src="promo.js" defer></script>
</head>
<body>
  <main class="promo-canvas" aria-label="Material promocional PastePort">
    <section class="promo promo-small" aria-label="Bloco promocional pequeno">
      <span class="small-glow small-glow-one" aria-hidden="true"></span>
      <span class="small-glow small-glow-two" aria-hidden="true"></span>

      <header class="brand small-brand" data-essential>
        <span class="pasteport-logo small-logo" aria-hidden="true">
          <span class="logo-sheet"></span>
          <span class="logo-letter">P</span>
        </span>
        <strong data-font-check>PastePort</strong>
      </header>

      <div class="small-copy">
        <h1 data-essential data-font-check>Cole imagens<br>direto no upload</h1>
        <p data-essential data-font-check>Sem baixar. Sem salvar.<br>Só colar.</p>
      </div>

      <div class="small-visual" data-essential aria-label="Imagem sendo transferida para um campo de upload">
        <div class="image-tile small-image-tile">
          <span class="image-sun"></span>
          <span class="image-hill image-hill-back"></span>
          <span class="image-hill image-hill-front"></span>
        </div>
        <span class="small-flow-line" aria-hidden="true"></span>
        <span class="paste-node small-paste-node" aria-hidden="true">P</span>
        <div class="upload-tile small-upload-tile">
          <span class="upload-arrow" aria-hidden="true"></span>
          <span class="upload-line"></span>
        </div>
      </div>
    </section>

    <section class="promo promo-marquee" aria-label="Letreiro promocional">
      <span class="marquee-shape marquee-shape-one" aria-hidden="true"></span>
      <span class="marquee-shape marquee-shape-two" aria-hidden="true"></span>
      <span class="marquee-shape marquee-shape-three" aria-hidden="true"></span>

      <header class="brand marquee-brand" data-essential>
        <span class="pasteport-logo marquee-logo" aria-hidden="true">
          <span class="logo-sheet"></span>
          <span class="logo-letter">P</span>
        </span>
        <strong data-font-check>PastePort</strong>
      </header>

      <div class="marquee-copy">
        <h1 data-essential data-font-check>Cole imagens direto<br>no upload</h1>
        <p data-essential data-font-check>Sem baixar. Sem salvar. Só colar.</p>
        <div class="shortcut" data-essential data-font-check aria-label="Atalho Control mais V">
          <kbd>Ctrl</kbd>
          <span>+</span>
          <kbd>V</kbd>
        </div>
      </div>

      <div class="marquee-visual" data-essential aria-label="Imagem copiada passando pelo PastePort para um upload">
        <div class="source-card">
          <div class="image-tile marquee-image-tile">
            <span class="image-sun"></span>
            <span class="image-hill image-hill-back"></span>
            <span class="image-hill image-hill-front"></span>
          </div>
          <span class="copy-corner" aria-hidden="true"></span>
        </div>

        <span class="flow-arrow flow-arrow-left" aria-hidden="true"></span>

        <div class="pasteport-card">
          <div class="pasteport-card-header">
            <span class="pasteport-logo card-logo" aria-hidden="true">
              <span class="logo-sheet"></span>
              <span class="logo-letter">P</span>
            </span>
            <span class="card-header-line"></span>
          </div>
          <div class="clipboard-symbol" aria-hidden="true">
            <span class="clipboard-clip"></span>
            <span class="clipboard-image">
              <span></span>
            </span>
          </div>
          <div class="card-action" aria-hidden="true">
            <span class="card-action-arrow"></span>
          </div>
        </div>

        <span class="flow-arrow flow-arrow-right" aria-hidden="true"></span>

        <div class="destination-card">
          <span class="destination-arrow" aria-hidden="true"></span>
          <span class="destination-line"></span>
          <span class="destination-line destination-line-short"></span>
          <span class="destination-check" aria-hidden="true">✓</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
